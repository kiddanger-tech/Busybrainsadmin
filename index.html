<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Busy Brains Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --stone: #1c1a17;
      --muted: #716b62;
      --sand: #ece6da;
      --card: #f7f3eb;
      --clay: #a8623f;
      --green: #2f6b4f;
      --red: #9b3d32;
      --border: #d8d0c2;
      --white: #ffffff;
      --shadow: 0 10px 30px rgba(28, 26, 23, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--sand);
      color: var(--stone);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: var(--shadow);
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .tagline {
      color: var(--muted);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--white);
      border-radius: 12px;
      padding: 13px;
      outline: none;
      color: var(--stone);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--clay);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 13px 17px;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      width: 100%;
      background: var(--clay);
      color: white;
    }

    .btn-green {
      background: var(--green);
      color: white;
    }

    .btn-red {
      background: var(--red);
      color: white;
    }

    .btn-dark {
      background: var(--stone);
      color: white;
    }

    .btn-light {
      background: white;
      border: 1px solid var(--border);
      color: var(--stone);
    }

    .message {
      margin-top: 15px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      display: block;
      background: #f8e5e2;
      color: var(--red);
    }

    .message.success {
      display: block;
      background: #e3f0e8;
      color: var(--green);
    }

    /* =========================
       APP
    ========================= */

    #app {
      min-height: 100vh;
    }

    header {
      background: var(--stone);
      color: white;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 800;
    }

    .header-subtitle {
      font-size: 12px;
      color: #cfc8bd;
      margin-top: 3px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #625e58;
      color: white;
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 700;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px 50px;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 800;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(28, 26, 23, 0.03);
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .full {
      grid-column: 1 / -1;
    }

    /* =========================
       PDF LIST
    ========================= */

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .toolbar input {
      flex: 1;
    }

    .pdf-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .pdf-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .pdf-title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 7px;
      word-break: break-word;
    }

    .pdf-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .badge {
      background: var(--sand);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .actions .btn {
      padding: 8px 11px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 30px 15px;
      color: var(--muted);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .stat {
        padding: 11px;
      }

      .stat-number {
        font-size: 21px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .header-inner {
        align-items: flex-start;
      }

      .header-title {
        font-size: 19px;
      }

      .logout-btn {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
  ========================= -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="logo">Busy Brains</div>

      <div class="tagline">
        Admin Dashboard
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="Admin email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            required
          >
        </div>

        <button
          id="loginButton"
          class="btn btn-primary"
          type="submit"
        >
          Login
        </button>

      </form>

      <div id="loginMessage" class="message"></div>

    </div>

  </section>


  <!-- =========================
       ADMIN APP
  ========================= -->

  <div id="app" class="hidden">

    <header>

      <div class="header-inner">

        <div>
          <div class="header-title">
            Busy Brains Admin
          </div>

          <div class="header-subtitle">
            Manage your study PDF library
          </div>
        </div>

        <button
          id="logoutButton"
          class="logout-btn"
        >
          Logout
        </button>

      </div>

    </header>


    <main>

      <!-- STATS -->

      <div class="stats">

        <div class="stat">
          <div
            id="totalCount"
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            Total PDFs
          </div>
        </div>


        <div class="stat">
          <div
            id="trialCount"
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            Trial Papers
          </div>
        </div>


        <div class="stat">
          <div
            id="subjectCount"
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            Subjects
          </div>
        </div>

      </div>


      <!-- UPLOAD -->

      <section class="section">

        <div class="section-title">
          Upload PDF
        </div>

        <form id="uploadForm">

          <div class="grid">

            <div class="form-group">
              <label for="title">
                PDF Title
              </label>

              <input
                id="title"
                type="text"
                placeholder="e.g. Chemistry WASSCE Trial Paper 2026"
                required
              >
            </div>


            <div class="form-group">
              <label for="subject">
                Subject
              </label>

              <select id="subject">

                <option value="">
                  Select subject
                </option>

                <option>Mathematics</option>
                <option>Additional Mathematics</option>
                <option>English</option>
                <option>Physics</option>
                <option>Chemistry</option>
                <option>Biology</option>
                <option>Integrated Science</option>
                <option>Social Studies</option>
                <option>ICT</option>
                <option>Geography</option>
                <option>Economics</option>
                <option>Government</option>
                <option>History</option>
                <option>Agricultural Science</option>
                <option>Business</option>
                <option>French</option>
                <option>Other</option>

              </select>
            </div>


            <div class="form-group">

              <label for="type">
                PDF Type
              </label>

              <select id="type">

                <option value="Study Material">
                  Study Material
                </option>

                <option value="WASSCE Trial Paper">
                  WASSCE Trial Paper
                </option>

                <option value="Notes">
                  Notes
                </option>

                <option value="Past Questions">
                  Past Questions
                </option>

                <option value="Revision">
                  Revision
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>


            <div class="form-group">

              <label for="pdfFile">
                PDF File
              </label>

              <input
                id="pdfFile"
                type="file"
                accept="application/pdf,.pdf"
                required
              >

            </div>


            <div class="form-group full">

              <label for="meta">
                Description / Information
              </label>

              <textarea
                id="meta"
                placeholder="Example: WASSCE-style Chemistry practice questions for SHS students."
              ></textarea>

            </div>

          </div>


          <button
            id="uploadButton"
            class="btn btn-green"
            type="submit"
          >
            Upload PDF
          </button>

        </form>

        <div
          id="uploadMessage"
          class="message"
        ></div>

      </section>


      <!-- PDF LIBRARY -->

      <section class="section">

        <div class="section-title">
          PDF Library
        </div>

        <div class="toolbar">

          <input
            id="searchInput"
            type="search"
            placeholder="Search PDFs..."
          >

          <button
            id="refreshButton"
            class="btn btn-light"
          >
            Refresh
          </button>

        </div>


        <div
          id="pdfList"
          class="pdf-list"
        >

          <div class="loading">
            Loading PDFs...
          </div>

        </div>

      </section>

    </main>

  </div>


<script>
/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://lleqslgueprsfyazplwk.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsZXFzbGd1ZXByc2Z5YXpwbHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNDAwODEsImV4cCI6MjEwNTkxNjA4MX0.MlTBZj6BcoUtN_dDf_8xMtUF9G4Lk5iTPhRKEnaxuCY";

const BUCKET = "pdfs";


/* =========================================================
   SUPABASE CLIENT
   ========================================================= */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const loginEmail =
  document.getElementById("loginEmail");

const loginPassword =
  document.getElementById("loginPassword");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const logoutButton =
  document.getElementById("logoutButton");

const uploadForm =
  document.getElementById("uploadForm");

const uploadButton =
  document.getElementById("uploadButton");

const uploadMessage =
  document.getElementById("uploadMessage");

const pdfList =
  document.getElementById("pdfList");

const searchInput =
  document.getElementById("searchInput");

const refreshButton =
  document.getElementById("refreshButton");

const totalCount =
  document.getElementById("totalCount");

const trialCount =
  document.getElementById("trialCount");

const subjectCount =
  document.getElementById("subjectCount");


/* =========================================================
   HELPERS
   ========================================================= */

function showMessage(element, message, type) {

  element.textContent = message;

  element.className =
    "message " + type;

}


function hideMessage(element) {

  element.textContent = "";

  element.className = "message";

}


function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function safeFileName(name) {

  return name
    .replace(/[^a-zA-Z0-9._-]/g, "_")
    .replace(/_+/g, "_");
}


/* =========================================================
   AUTH
   ========================================================= */

async function checkCurrentSession() {

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if (error) {
    console.error(error);
    showLogin();
    return;
  }

  if (data.session) {

    await checkAdmin();

  } else {

    showLogin();

  }
}


/* =========================================================
   CHECK ADMIN
   ========================================================= */

async function checkAdmin() {

  const {
    data: {
      user
    }
  } = await supabaseClient.auth.getUser();


  if (!user) {

    showLogin();
    return;

  }


  const {
    data,
    error
  } = await supabaseClient
    .from("admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();


  if (error) {

    console.error(error);

    await supabaseClient.auth.signOut();

    showLogin();

    showMessage(
      loginMessage,
      "Could not verify admin account: " + error.message,
      "error"
    );

    return;

  }


  if (!data) {

    await supabaseClient.auth.signOut();

    showLogin();

    showMessage(
      loginMessage,
      "This account is not registered as a Busy Brains admin.",
      "error"
    );

    return;

  }


  showApp();

}


/* =========================================================
   SHOW / HIDE SCREENS
   ========================================================= */

function showLogin() {

  loginScreen.classList.remove("hidden");

  app.classList.add("hidden");

}


function showApp() {

  loginScreen.classList.add("hidden");

  app.classList.remove("hidden");

  loadFiles();

}


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    hideMessage(loginMessage);

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";


    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value;


    const {
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


    if (error) {

      showMessage(
        loginMessage,
        error.message,
        "error"
      );

      loginButton.disabled = false;
      loginButton.textContent = "Login";

      return;

    }


    await checkAdmin();


    loginButton.disabled = false;
    loginButton.textContent = "Login";

  }
);


/* =========================================================
   LOGOUT
   ========================================================= */

logoutButton.addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    showLogin();

  }
);


/* =========================================================
   LOAD FILES
   ========================================================= */

let allFiles = [];


async function loadFiles() {

  pdfList.innerHTML =
    '<div class="loading">Loading PDFs...</div>';


  const {
    data,
    error
  } = await supabaseClient
    .from("files")
    .select(
      "id, title, subject, type, meta, storage_path, created_at"
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    pdfList.innerHTML = `
      <div class="empty">
        Failed to load PDFs.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;

  }


  allFiles = data || [];

  updateStats();

  renderFiles(allFiles);

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

  totalCount.textContent =
    allFiles.length;


  const trials =
    allFiles.filter(
      file =>
        String(file.type || "")
          .toLowerCase()
          .includes("trial")
    ).length;


  trialCount.textContent =
    trials;


  const subjects =
    new Set(
      allFiles
        .map(file => file.subject)
        .filter(Boolean)
    );


  subjectCount.textContent =
    subjects.size;

}


/* =========================================================
   RENDER FILES
   ========================================================= */

function renderFiles(files) {

  if (!files.length) {

    pdfList.innerHTML = `
      <div class="empty">
        No PDFs yet.
      </div>
    `;

    return;

  }


  pdfList.innerHTML =
    files.map(file => {

      const date =
        file.created_at
          ? new Date(file.created_at)
              .toLocaleDateString()
          : "";


      return `
        <div class="pdf-card">

          <div class="pdf-title">
            ${escapeHtml(file.title)}
          </div>

          <div class="badges">

            ${
              file.subject
                ? `<span class="badge">
                    ${escapeHtml(file.subject)}
                   </span>`
                : ""
            }

            ${
              file.type
                ? `<span class="badge">
                    ${escapeHtml(file.type)}
                   </span>`
                : ""
            }

          </div>


          <div class="pdf-meta">

            ${
              file.meta
                ? escapeHtml(file.meta)
                : "No description."
            }

            <br><br>

            Added:
            ${escapeHtml(date)}

          </div>


          <div class="actions">

            <button
              class="btn btn-light"
              onclick="editFile('${escapeHtml(file.id)}')"
            >
              Edit
            </button>

            <button
              class="btn btn-dark"
              onclick="downloadFile('${escapeHtml(file.id)}')"
            >
              Download
            </button>

            <button
              class="btn btn-red"
              onclick="deleteFile('${escapeHtml(file.id)}')"
            >
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");

}


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener(
  "input",
  function() {

    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!query) {

      renderFiles(allFiles);
      return;

    }


    const filtered =
      allFiles.filter(file => {

        return [

          file.title,
          file.subject,
          file.type,
          file.meta

        ]
          .filter(Boolean)
          .some(value =>
            String(value)
              .toLowerCase()
              .includes(query)
          );

      });


    renderFiles(filtered);

  }
);


/* =========================================================
   REFRESH
   ========================================================= */

refreshButton.addEventListener(
  "click",
  loadFiles
);


/* =========================================================
   UPLOAD PDF
   ========================================================= */

uploadForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    hideMessage(uploadMessage);


    const title =
      document.getElementById("title")
        .value.trim();

    const subject =
      document.getElementById("subject")
        .value;

    const type =
      document.getElementById("type")
        .value;

    const meta =
      document.getElementById("meta")
        .value.trim();

    const fileInput =
      document.getElementById("pdfFile");

    const file =
      fileInput.files[0];


    if (!file) {

      showMessage(
        uploadMessage,
        "Please select a PDF file.",
        "error"
      );

      return;

    }


    if (
      file.type !== "application/pdf" &&
      !file.name.toLowerCase().endsWith(".pdf")
    ) {

      showMessage(
        uploadMessage,
        "Only PDF files are allowed.",
        "error"
      );

      return;

    }


    /*
      50 MB browser-side safety limit.
    */

    const maxSize =
      50 * 1024 * 1024;


    if (file.size > maxSize) {

      showMessage(
        uploadMessage,
        "The PDF is larger than 50 MB.",
        "error"
      );

      return;

    }


    uploadButton.disabled = true;
    uploadButton.textContent = "Uploading...";


    try {

      /*
        Generate unique storage path.
      */

      const uniqueId =
        crypto.randomUUID();


      const cleanName =
        safeFileName(file.name);


      const storagePath =
        `uploads/${uniqueId}-${cleanName}`;


      /*
        Upload PDF to Supabase Storage.
      */

      const {
        error: storageError
      } = await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
          storagePath,
          file,
          {
            contentType: "application/pdf",
            upsert: false
          }
        );


      if (storageError) {

        throw new Error(
          "Storage upload failed: " +
          storageError.message
        );

      }


      /*
        Add PDF information to database.
      */

      const {
        error: databaseError
      } = await supabaseClient
        .from("files")
        .insert({

          title,
          subject: subject || null,
          type: type || null,
          meta: meta || null,
          storage_path: storagePath

        });


      if (databaseError) {

        /*
          If database insertion fails,
          remove the uploaded file so we
          don't leave an orphaned PDF.
        */

        await supabaseClient
          .storage
          .from(BUCKET)
          .remove([storagePath]);


        throw new Error(
          "Database insert failed: " +
          databaseError.message
        );

      }


      showMessage(
        uploadMessage,
        "PDF uploaded successfully.",
        "success"
      );


      uploadForm.reset();


      await loadFiles();


    } catch (error) {

      console.error(error);

      showMessage(
        uploadMessage,
        error.message || "Upload failed.",
        "error"
      );

    }


    uploadButton.disabled = false;
    uploadButton.textContent = "Upload PDF";

  }
);


/* =========================================================
   DOWNLOAD FILE
   ========================================================= */

async function downloadFile(id) {

  const file =
    allFiles.find(
      item => item.id === id
    );


  if (!file) {

    alert("PDF not found.");
    return;

  }


  try {

    const {
      data,
      error
    } = await supabaseClient
      .storage
      .from(BUCKET)
      .download(
        file.storage_path
      );


    if (error) {

      throw error;

    }


    const url =
      URL.createObjectURL(data);


    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      safeFileName(
        file.title + ".pdf"
      );


    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(
      () => URL.revokeObjectURL(url),
      10000
    );


  } catch (error) {

    console.error(error);

    alert(
      "Could not download PDF: " +
      error.message
    );

  }

}


/* =========================================================
   EDIT FILE
   ========================================================= */

async function editFile(id) {

  const file =
    allFiles.find(
      item => item.id === id
    );


  if (!file) {

    alert("PDF not found.");
    return;

  }


  const newTitle =
    prompt(
      "PDF title:",
      file.title || ""
    );


  if (newTitle === null) {
    return;
  }


  const newSubject =
    prompt(
      "Subject:",
      file.subject || ""
    );


  if (newSubject === null) {
    return;
  }


  const newType =
    prompt(
      "Type:",
      file.type || ""
    );


  if (newType === null) {
    return;
  }


  const newMeta =
    prompt(
      "Description:",
      file.meta || ""
    );


  if (newMeta === null) {
    return;
  }


  const {
    error
  } = await supabaseClient
    .from("files")
    .update({

      title:
        newTitle.trim(),

      subject:
        newSubject.trim() || null,

      type:
        newType.trim() || null,

      meta:
        newMeta.trim() || null

    })
    .eq(
      "id",
      id
    );


  if (error) {

    alert(
      "Update failed: " +
      error.message
    );

    return;

  }


  await loadFiles();

}


/* =========================================================
   DELETE FILE
   ========================================================= */

async function deleteFile(id) {

  const file =
    allFiles.find(
      item => item.id === id
    );


  if (!file) {

    alert("PDF not found.");
    return;

  }


  const confirmed =
    confirm(
      `Delete "${file.title}"?\n\nThis will remove the PDF from Storage and the database.`
    );


  if (!confirmed) {
    return;
  }


  try {

    /*
      Delete Storage object first.
    */

    const {
      error: storageError
    } = await supabaseClient
      .storage
      .from(BUCKET)
      .remove([
        file.storage_path
      ]);


    if (storageError) {

      throw new Error(
        "Storage deletion failed: " +
        storageError.message
      );

    }


    /*
      Delete database record.
    */

    const {
      error: databaseError
    } = await supabaseClient
      .from("files")
      .delete()
      .eq(
        "id",
        id
      );


    if (databaseError) {

      throw new Error(
        "Database deletion failed: " +
        databaseError.message
      );

    }


    await loadFiles();


  } catch (error) {

    console.error(error);

    alert(
      "Delete failed: " +
      error.message
    );

  }

}
